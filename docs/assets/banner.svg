<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="PlacePilot - a placement agent that asks before it applies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0e"/><stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c6ff00"/><stop offset="100%" stop-color="#8affc1"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <g opacity="0.10" stroke="#c6ff00" stroke-width="1">
    <path d="M0 20 H1200" /><path d="M0 44 H1200" /><path d="M0 68 H1200" /><path d="M0 92 H1200" /><path d="M0 116 H1200" /><path d="M0 140 H1200" /><path d="M0 164 H1200" /><path d="M0 188 H1200" /><path d="M0 212 H1200" /><path d="M0 236 H1200" />
  </g>

  <!-- mark -->
  <g transform="translate(70,70)">
    <rect width="120" height="120" rx="28" fill="#c6ff00">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <path d="M42 92V28h30a20 20 0 0 1 0 40H42" fill="none" stroke="#0b0c00" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </path>
  </g>

  <text x="225" y="132" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f2f2f5" letter-spacing="-2">
    PlacePilot
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" fill="freeze"/>
  </text>
  <text x="227" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#9a9aa6" letter-spacing="0.5">
    a placement agent that asks before it applies
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.9s" fill="freeze"/>
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <g transform="translate(228,196)">
      <rect width="196" height="30" rx="15" fill="#c6ff00" opacity="0.12" stroke="#c6ff00" stroke-opacity="0.45"/>
      <circle cx="16" cy="15" r="4" fill="#c6ff00"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="30" y="20" fill="#c6ff00">nothing sends itself</text>
    </g>
    <g transform="translate(436,196)">
      <rect width="176" height="30" rx="15" fill="#121218" stroke="#2a2a33"/>
      <text x="16" y="20" fill="#9a9aa6">HTTP 422 gate</text>
    </g>
    <g transform="translate(624,196)">
      <rect width="188" height="30" rx="15" fill="#121218" stroke="#2a2a33"/>
      <text x="16" y="20" fill="#9a9aa6">grounded claims</text>
    </g>
  </g>

  <text x="1130" y="236" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5c5c68">
    AgentX 2026 - PS-06 - Team ZYRO
  </text>
</svg>
