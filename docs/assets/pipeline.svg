    <text x="74.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9a9aa6">re-plan on thin results</text>
  </g>
  <g>
    <line x1="697" y1="139" x2="715" y2="139" stroke="#2a2a33" stroke-width="2"/>
