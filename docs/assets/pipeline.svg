    <text x="74.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9a9aa6">PDF -&gt; verified facts</text>
  </g>
  <g>
    <line x1="181" y1="139" x2="199" y2="139" stroke="#2a2a33" stroke-width="2"/>
    <circle r="3" fill="#c6ff00">
      <animateMotion dur="2.2s" begin="0.0s" repeatCount="indefinite"
        path="M181,139 L199,139"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <path d="M194 134 l6 5 -6 5" fill="none" stroke="#2a2a33" stroke-width="2"/>
  </g>
