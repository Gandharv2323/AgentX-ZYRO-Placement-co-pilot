  </g>
  <g transform="translate(1062,96)">
    <rect width="148" height="86" rx="12" fill="#121218"
          stroke="#2a2a33" stroke-width="1">
      
    </rect>
    <text x="74.0" y="34" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700"
          fill="#f2f2f5">Send</text>
    <text x="74.0" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#9a9aa6">local outbox record</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="30" y="228" fill="#ff7a70">blocked without approval:</text>
    <text x="182" y="228" fill="#9a9aa6">POST /api/applications/{id}/send  ->  422 approval_required</text>
    <text x="30" y="250" fill="#9a9aa6">bundle_hash</text>
    <text x="126" y="250" fill="#c6ff00">bndl_9c2e...</text>
    <text x="30" y="272" fill="#9a9aa6">approve a bundle, then the outbox accepts a matching hash - edit a fact and that yes expires</text>
  </g>
