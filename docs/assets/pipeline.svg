      <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.28s" repeatCount="indefinite"/>
    </circle>
    <path d="M366 134 l6 5 -6 5" fill="none" stroke="#2a2a33" stroke-width="2"/>
  </g>
