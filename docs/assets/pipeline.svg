<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="PlacePilot pipeline: resume to verified facts, plan, act, observe, ground, human approval gate, send">
  <rect width="1200" height="300" rx="14" fill="#0a0a0c"/>
  <text x="30" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f2f2f5">The loop, and the one door it cannot open on its own</text>
  <text x="30" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9a9aa6">every tool call is logged - the send tool is refused by the route, the executor and a SQLite trigger</text>
  
  <g transform="translate(30,96)">
    <rect width="148" height="86" rx="12" fill="#121218"
          stroke="#2a2a33" stroke-width="1">
      
    </rect>
